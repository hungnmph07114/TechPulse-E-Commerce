spring.application.name=ecommerce-backend
server.port=8080

# PostgreSQL Database Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SQL_USER:postgres}
spring.datasource.password=${SQL_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional MySQL Database Configuration (Uncomment if running local MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=techpulse_super_secure_jwt_secret_key_2026_spring_boot_react_mysql_3526189502
app.jwt.expiration-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# Logging
logging.level.com.example.ecommerce=INFO
logging.level.org.springframework.security=WARN
